name: Docker Image for gocryptfs

on:
  push:
    branches: [ "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: mac-lucky/actions-shared-workflows/.github/workflows/docker-cicd-reusable.yml@master
    with:
      app_name: "gocryptfs"
      dockerhub_image: "maclucky/gocryptfs"
      ghcr_image: "ghcr.io/mac-lucky/gocryptfs-docker"
      enable_security_scan: true
      govulncheck_binary: "/usr/local/bin/gocryptfs"
      smoke_test_script: docker run --rm "$SMOKE_IMAGE" gocryptfs --version
      push_to_dockerhub: false
